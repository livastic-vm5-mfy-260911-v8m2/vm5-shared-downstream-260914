queue_rules:
  - name: vm5-merge-batch-head-freshness
    queue_conditions: []
    merge_conditions:
      - check-success = VM5 Batch CI
      - check-success = VM5 Gate B
    batch_size: 2
    batch_max_wait_time: 2 minutes
    merge_method: merge-batch
    branch_protection_injection_mode: none
pull_request_rules:
  - name: vm5-autoqueue-merge-batch-head-freshness
    conditions:
      - title ~= ^VM5_MB_HEAD_
    actions:
      queue: {}
